<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No Me Siguen</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; background: #0b0b0e; color: #fff; }
    h1 { font-size: 1.4rem; text-align: center; }
    .box { background: #1c1c24; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
    input[type="file"] { width: 100%; font-size: 0.85rem; }
    button { width: 100%; padding: 12px; background: #007aff; border: none; border-radius: 10px; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; }
    #resultado { margin-top: 20px; }
    ul { list-style: none; padding: 0; }
    li { background: #1c1c24; padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    a { color: #3897f0; text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>

  <h1>Comparador de Seguidores</h1>

  <div class="box">
    <label>1. Archivo de Seguidores (followers_1.json):</label>
    <input type="file" id="fileFollowers" accept=".json">
  </div>

  <div class="box">
    <label>2. Archivo de Seguidos (following.json):</label>
    <input type="file" id="fileFollowing" accept=".json">
  </div>

  <button onclick="comparar()">Analizar</button>

  <div id="resultado"></div>

  <script>
    async function leerJSON(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(JSON.parse(e.target.result));
        reader.onerror = reject;
        reader.readAsText(file);
      });
    }

    async function comparar() {
      const f1 = document.getElementById('fileFollowers').files[0];
      const f2 = document.getElementById('fileFollowing').files[0];
      const resDiv = document.getElementById('resultado');

      if (!f1 || !f2) {
        alert('Por favor selecciona ambos archivos JSON.');
        return;
      }

      try {
        const dataFollowers = await leerJSON(f1);
        const dataFollowing = await leerJSON(f2);

        // Extrae nombres de usuario de seguidores
        const followersSet = new Set();
        // El formato de followers suele ser un array directo
        const followersList = Array.isArray(dataFollowers) ? dataFollowers : (dataFollowers.relationships_followers || []);
        followersList.forEach(item => {
          if (item.string_list_data && item.string_list_data[0]) {
            followersSet.add(item.string_list_data[0].value);
          }
        });

        // Extrae seguidos y filtra
        const followingList = dataFollowing.relationships_following || dataFollowing;
        const noMeSiguen = [];

        followingList.forEach(item => {
          if (item.string_list_data && item.string_list_data[0]) {
            const user = item.string_list_data[0].value;
            if (!followersSet.has(user)) {
              noMeSiguen.push(user);
            }
          }
        });

        resDiv.innerHTML = `<h3>Total que no te siguen: ${noMeSiguen.length}</h3>`;
        const ul = document.createElement('ul');
        noMeSiguen.forEach(user => {
          const li = document.createElement('li');
          li.innerHTML = `<span>${user}</span> <a href="https://instagram.com/${user}" target="_blank">Ver perfil</a>`;
          ul.appendChild(li);
        });
        resDiv.appendChild(ul);

      } catch (err) {
        alert('Error al leer los archivos. Asegúrate de exportar en formato JSON.');
        console.error(err);
      }
    }
  </script>
</body>
</html>
